[package]
name = "keyboard-tester"
version = "0.1.0"
edition = "2024"

[dependencies]
evdev = "0.13.2"
gpui = { version = "=0.2.2", default-features = false, features = ["wayland", "x11"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wayland-client = { version = "0.31", features = ["system"] }
x11rb = { version = "0.13", features = ["xinput"] }

[profile.dev]
debug = 0
